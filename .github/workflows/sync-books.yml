name: Sync books from Goodreads

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-books
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Goodreads
        env:
          # Not secret (the ID appears in the rendered link on the site),
          # but kept here as a single source of truth. Swap to
          # ${{ secrets.GOODREADS_USER_ID }} if you ever want it hidden.
          GOODREADS_USER_ID: '198396455'
        run: npm run sync:books

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet src/data/books.json; then
            echo "No changes to books.json"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/books.json
          git commit -m "chore: sync books from Goodreads"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.commit.outputs.changed == 'true'
        run: npm run build

      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
